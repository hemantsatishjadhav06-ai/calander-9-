name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: default to read-only for every job.
# Individual jobs can opt into more permissions if needed.
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Agency UI state tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked UI test dependencies
        run: npm ci --ignore-scripts
      - name: Run UI state tests
        run: npm run test:ui

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff==0.15.9"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # mypy loads Django settings during type inference; it never hits a DB.
      SECRET_KEY: test-secret-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: mypy
        run: mypy apps/ config/ providers/ tests/ --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Pulled via AWS's public mirror of Docker Hub official images —
        # avoids anonymous Docker Hub pulls, whose timeouts/rate limits
        # broke main CI on 2026-06-10 (run 27262568530).
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: brightbean_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightbean_test
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      # Catches a model change whose migration was never generated. The
      # companion hazard — a migration that is fine against an empty table but
      # fails on one with rows — is covered by tests that apply migrations over
      # seeded data (see apps/inbox/tests/test_reply_lifecycle_migrations.py).
      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest --cov=apps --cov-report=term-missing

  build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, ui]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Check generated cloud Dockerfile
        run: python tools/generate_cloud_dockerfile.py --check

      - name: Build canonical image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: brightbean:canonical
          cache-from: type=gha,scope=canonical
          cache-to: type=gha,mode=max,scope=canonical

      - name: Build cloud image with CA secret
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.cloud
          push: false
          load: true
          tags: brightbean:cloud
          # Secret contents do not affect cache keys. Execute the installation
          # steps so this verifies mounted CA trust rather than a cached layer.
          no-cache-filters: frontend,base
          secret-files: |
            build_ca_bundle=/etc/ssl/certs/ca-certificates.crt
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud

      - name: Verify cloud CA secret stays outside the runtime
        run: |
          docker run --rm --entrypoint python brightbean:cloud -c '
          import os
          from pathlib import Path
          assert not Path("/run/secrets/build_ca_bundle").exists()
          assert "PIP_CERT" not in os.environ
          assert "NODE_EXTRA_CA_CERTS" not in os.environ
          assert not Path("/app/.env").exists()
          '

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # We invoke the gitleaks binary directly rather than using
    # gitleaks/gitleaks-action, because that action now requires a paid
    # license for GitHub organizations. The binary itself remains free
    # and open source under the MIT license.
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fLsS --retry 3 -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fLsS --retry 3 -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing gitleaks_checksums.txt)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner
