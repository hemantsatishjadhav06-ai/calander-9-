# Build config (Dockerfile) for the Railway one-click template:
#   https://railway.com/new
# The template provisions three services that share this image:
#   - web:     Gunicorn (Dockerfile CMD), runs `python manage.py migrate` on startup
#   - worker:  `python manage.py run_worker`  (django-background-tasks, see apps/common/management)
#   - Postgres
# The web service's startup migrate fires the `post_migrate` hooks that register
# the recurring jobs (publishing, inbox sync, retries, reminders, cleanups); the
# worker then runs them, so scheduling works out of the box.
#
# Wiring Railway MANUALLY from this repo instead of the template? Replicate both:
# a worker service running `run_worker`, and `migrate` on each deploy — the
# Dockerfile CMD only starts Gunicorn, so neither happens on its own.
#
# THIS FILE APPLIES TO EVERY SERVICE BUILT FROM THE REPO — web and worker
# alike (the worker's build log shows the Dockerfile steps). So nothing here
# may be web-only:
#   - No healthcheckPath. The worker serves no HTTP, so a health check here
#     fails every worker deploy. Set `/health/` on the web service itself
#     (Settings > Deploy > Healthcheck path), with `healthcheck.railway.app`
#     allowed — config/settings/base.py adds it when RAILWAY_ENVIRONMENT is set.
#   - No preDeployCommand. Both services would run `migrate` at once.
#   - Restart ALWAYS, not ON_FAILURE: the worker exits 0 when it stops
#     gracefully (SIGTERM, or `--duration`), and ON_FAILURE leaves a cleanly
#     exited worker stopped — no publishing until someone notices.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "always"
