{% comment %}The SEO score ring. Context: report (apps.blog.seo.Report), ring ({radius, circumference, dash}), optional size ("sm").{% endcomment %}
<div class="relative flex-shrink-0 {% if size == 'sm' %}size-12{% else %}size-16{% endif %}">
    <svg viewBox="0 0 64 64" class="size-full -rotate-90" aria-hidden="true">
        <circle cx="32" cy="32" r="{{ ring.radius }}" fill="none" stroke="currentColor" stroke-width="6" class="text-ink-200"></circle>
        <circle cx="32" cy="32" r="{{ ring.radius }}" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="{{ ring.dash }} {{ ring.circumference }}"
                class="{% if report.tone == 'good' %}text-success-500{% elif report.tone == 'fair' %}text-warning-500{% else %}text-danger-500{% endif %}"></circle>
    </svg>
    <span class="absolute inset-0 flex items-center justify-center font-semibold tabular-nums text-ink-950 {% if size == 'sm' %}text-base{% else %}text-xl{% endif %}" aria-hidden="true">{{ report.score }}</span>
</div>
