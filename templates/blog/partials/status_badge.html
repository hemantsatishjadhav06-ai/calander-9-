{% comment %}Status pill for a blog post. Context: status (value), label (display). Colours meet WCAG AA on their tint.{% endcomment %}
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap
    {% if status == 'draft' %}bg-ink-100 text-ink-700
    {% elif status == 'pending_review' %}bg-warning-50 text-warning-600 ring-1 ring-inset ring-warning-200
    {% elif status == 'changes_requested' %}bg-brand-50 text-brand-800 ring-1 ring-inset ring-brand-200
    {% elif status == 'approved' %}bg-success-50 text-success-600 ring-1 ring-inset ring-success-200
    {% elif status == 'publishing' %}bg-info-50 text-info-600 ring-1 ring-inset ring-info-200
    {% elif status == 'published' %}bg-success-50 text-success-600 ring-1 ring-inset ring-success-200
    {% elif status == 'failed' %}bg-danger-50 text-danger-600 ring-1 ring-inset ring-danger-200
    {% else %}bg-ink-100 text-ink-700{% endif %}">
    {% if status == 'publishing' %}<svg class="w-3 h-3 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>{% endif %}
    {{ label }}
</span>
