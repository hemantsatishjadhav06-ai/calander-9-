{% comment %}Unread replies from the team, for the portal nav (desktop badge, plus the mobile one out of band). Context: count.{% endcomment %}
<span id="team-unread-desktop">{% if count %}<span class="ml-1 inline-flex items-center px-1.5 py-px rounded-full text-[0.6875rem] font-bold bg-orange-100 text-orange-800">{{ count }}<span class="sr-only"> unread</span></span>{% endif %}</span>
<span id="team-unread-mobile" hx-swap-oob="true">{% if count %}<span class="ml-1 inline-flex items-center px-1.5 py-px rounded-full text-[0.6875rem] font-bold bg-orange-100 text-orange-800">{{ count }}<span class="sr-only"> unread</span></span>{% endif %}</span>
