{% comment %}Unread replies from the team, for the portal nav (desktop badge, plus the mobile one out of band). Context: count.{% endcomment %}
<span id="team-unread-desktop">{% if count %}<span class="ui-badge ml-1">{{ count }}<span class="sr-only"> unread</span></span>{% endif %}</span>
<span id="team-unread-mobile" hx-swap-oob="true">{% if count %}<span class="ui-badge ml-1">{{ count }}<span class="sr-only"> unread</span></span>{% endif %}</span>
