{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to {{ workspace.name }}</title>
    <link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'favicon/favicon-96x96.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="auth-bg flex min-h-screen items-center justify-center px-4 py-12">
    <main class="w-full max-w-[400px]">
        <div class="auth-card">
            {% if workspace.organization.logo_url %}
            <img src="{{ workspace.organization.logo_url }}" alt="" class="mb-6 h-8 w-auto">
            {% else %}
            <div class="mb-6 flex size-10 items-center justify-center rounded-[10px] bg-ink-900 text-base font-semibold text-white" aria-hidden="true">{{ workspace.name|make_list|first|upper }}</div>
            {% endif %}

            <h1 class="text-h1 text-ink-950">Sign in to {{ workspace.name }}</h1>
            <p class="mt-1.5 text-body-lg text-ink-600">
                Continue to review and approve scheduled posts for {{ workspace.name }}.
            </p>

            <form method="post" action="{% url 'client_portal:magic_link_entry' token=token %}" class="mt-6">
                {% csrf_token %}
                <button type="submit" class="ui-btn ui-btn-primary ui-btn-lg w-full">Continue to portal</button>
            </form>
        </div>
    </main>
</body>
</html>
