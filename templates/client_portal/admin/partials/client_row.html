<div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-ink-200 px-5 py-4 last:border-b-0" id="client-{{ client.membership.id }}">
    <!-- Avatar -->
    <div class="flex size-9 flex-shrink-0 items-center justify-center rounded-full bg-ink-100 text-sm font-semibold text-ink-700" aria-hidden="true">
        {{ client.user.display_name|first|upper }}
    </div>

    <!-- Name & Email -->
    <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-semibold text-ink-900">{{ client.user.display_name }}</div>
        <div class="truncate text-xs text-ink-500">{{ client.user.email }}</div>
    </div>

    <!-- Portal Link Status -->
    <div class="flex-shrink-0">
        {% if client.token %}
        <span class="ui-pill ui-pill-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Link active</span>
        {% else %}
        <span class="ui-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>No link sent</span>
        {% endif %}
    </div>

    <!-- Actions -->
    <div class="flex flex-shrink-0 flex-wrap items-center gap-1.5 max-sm:w-full max-sm:pl-[52px]">
        <!-- Send / Resend Portal Link -->
        <form hx-post="{% url 'client_portal_admin:send_magic_link' workspace_id=client.membership.workspace_id membership_id=client.membership.id %}"
              hx-target="#client-{{ client.membership.id }}"
              hx-swap="outerHTML">
            {% csrf_token %}
            <button type="submit" class="ui-btn ui-btn-secondary ui-btn-sm">
                {% if client.token %}Resend link{% else %}Send portal link{% endif %}
            </button>
        </form>

        <!-- Revoke Portal Link -->
        {% if client.token %}
        <form hx-post="{% url 'client_portal_admin:revoke_magic_link' workspace_id=client.membership.workspace_id membership_id=client.membership.id %}"
              hx-target="#client-{{ client.membership.id }}"
              hx-swap="outerHTML"
              hx-confirm="Revoke {{ client.user.display_name }}'s portal link? Anyone holding it — including a forwarded copy — loses access immediately. They stay a client and you can send a new link at any time.">
            {% csrf_token %}
            <button type="submit" class="ui-btn ui-btn-ghost ui-btn-sm">Revoke link</button>
        </form>
        {% endif %}

        <!-- Remove -->
        <form hx-post="{% url 'client_portal_admin:remove_client' workspace_id=client.membership.workspace_id membership_id=client.membership.id %}"
              hx-target="#client-{{ client.membership.id }}"
              hx-swap="delete"
              hx-confirm="Remove {{ client.user.display_name }} from this workspace? Their portal access will be revoked.">
            {% csrf_token %}
            <button type="submit" class="ui-btn ui-btn-danger-ghost ui-btn-sm">Remove</button>
        </form>
    </div>
</div>
