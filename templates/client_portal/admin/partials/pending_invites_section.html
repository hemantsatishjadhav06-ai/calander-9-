{% if pending_invites %}
<section class="overflow-hidden rounded-2xl border border-ink-200 bg-white shadow-xs" aria-labelledby="client-invites-heading">
    <div class="border-b border-ink-200 px-5 py-4">
        <h3 id="client-invites-heading" class="text-h3 text-ink-950">Pending invitations</h3>
    </div>
    <div id="client-invitations-list">
        {% for invite in pending_invites %}
        <div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-ink-200 px-5 py-4 last:border-b-0" id="client-invite-{{ invite.id }}">
            <!-- Email icon -->
            <div class="flex size-9 flex-shrink-0 items-center justify-center rounded-full bg-ink-100 text-ink-500" aria-hidden="true">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>

            <!-- Email & Info -->
            <div class="min-w-0 flex-1">
                <div class="truncate text-sm font-semibold text-ink-900">{{ invite.email }}</div>
                <div class="text-xs text-ink-500">
                    Invited by {{ invite.invited_by.display_name }} · Expires {{ invite.expires_at|timesince }} from now
                </div>
            </div>

            <!-- Status -->
            <div class="flex-shrink-0">
                <span class="ui-pill ui-pill-warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Client · invited</span>
            </div>

            <!-- Actions -->
            <div class="flex flex-shrink-0 items-center gap-1.5 max-sm:w-full max-sm:pl-[52px]">
                <form hx-post="{% url 'members:resend_invite' invitation_id=invite.id %}"
                      hx-target="#client-invite-{{ invite.id }}"
                      hx-swap="outerHTML">
                    {% csrf_token %}
                    <button type="submit" class="ui-btn ui-btn-secondary ui-btn-sm">Resend</button>
                </form>
                <form hx-post="{% url 'members:revoke_invite' invitation_id=invite.id %}"
                      hx-target="#client-invite-{{ invite.id }}"
                      hx-swap="delete"
                      hx-confirm="Revoke invitation to {{ invite.email }}?">
                    {% csrf_token %}
                    <button type="submit" class="ui-btn ui-btn-danger-ghost ui-btn-sm">Revoke</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}
