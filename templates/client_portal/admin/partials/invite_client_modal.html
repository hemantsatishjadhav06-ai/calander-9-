<!-- Invite Client Modal -->
<template x-teleport="body">
    <div x-show="showInviteModal" x-transition.opacity
         class="ui-overlay z-50 flex items-end justify-center sm:items-center sm:p-4">
        <div @click.outside="showInviteModal = false"
             @keydown.escape.window="showInviteModal = false"
             x-show="showInviteModal"
             x-trap.noscroll="showInviteModal"
             role="dialog" aria-modal="true" aria-labelledby="invite-client-modal-title"
             x-transition
             class="ui-modal flex max-h-[92vh] flex-col max-sm:rounded-t-2xl max-sm:rounded-b-none sm:max-w-[480px]">

            <!-- Header -->
            <div class="ui-modal-header">
                <h3 id="invite-client-modal-title" class="ui-modal-title">Invite a client</h3>
                <button type="button" @click="showInviteModal = false" class="ui-btn ui-btn-icon -mr-2 -mt-1" aria-label="Close">
                    <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Form -->
            <form hx-post="{% url 'client_portal_admin:invite_client' workspace_id=request.workspace.id %}" hx-disabled-elt="find button[type=submit]" data-inline-error="#client-invite-error"
                  hx-target="#pending-invites-section"
                  hx-swap="innerHTML"
                  @htmx:after-request.window="if(event.detail.successful) { showInviteModal = false; document.getElementById('no-invites-placeholder')?.remove(); }"
                  class="flex min-h-0 flex-col">
                {% csrf_token %}

                <div class="ui-modal-body overflow-y-auto">
                    <!-- Email -->
                    <div class="mb-4">
                        <label for="client-email" class="ui-label">Email address</label>
                        <input type="email" id="client-email" name="email" required placeholder="client@example.com" class="ui-input">
                    </div>

                    <!-- Info -->
                    <div class="ui-callout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <p>The client will receive an invitation email to create an account. Once accepted, they will have <strong class="inline font-semibold text-ink-900">Client</strong> access to this workspace, allowing them to review and approve posts via the Client Portal.</p>
                    </div>

                    <!-- Error container -->
                    <div id="client-invite-error" class="mt-3"></div>
                </div>

                <!-- Submit -->
                <div class="ui-modal-footer max-sm:flex-col-reverse">
                    <button type="button" @click="showInviteModal = false" class="ui-btn ui-btn-secondary max-sm:w-full">Cancel</button>
                    <button type="submit" class="ui-btn ui-btn-primary max-sm:w-full">Send invitation</button>
                </div>
            </form>
        </div>
    </div>
</template>
