{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ problem_title }} · {{ SITE_NAME }}</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'favicon/favicon-96x96.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="auth-bg flex min-h-screen items-center justify-center px-4 py-12">
    <main class="w-full max-w-[400px]">
        <div class="auth-card">
            <div class="mb-5 grid size-10 place-items-center rounded-xl bg-ink-100 text-ink-700" aria-hidden="true">
                <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </div>

            <h1 class="text-h1 text-ink-950">{{ problem_title }}</h1>
            <p class="mt-1.5 text-body-lg text-ink-600">{{ problem_body }}</p>

            <div class="ui-callout mt-6">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <div class="min-w-0 flex-1">
                    <p class="ui-callout-title">Need a new link?</p>
                    <p class="mt-0.5">Ask your team to send you a fresh access link from the workspace settings.</p>
                    {% if SUPPORT_EMAIL %}
                    <a href="mailto:{{ SUPPORT_EMAIL }}?subject=New%20approval%20link" class="link-inline mt-2 inline-flex min-h-6 items-center font-medium">Request a new link</a>
                    {% endif %}
                </div>
            </div>
        </div>
        <p class="mt-6 text-center text-xs text-ink-500">{{ SITE_NAME }}</p>
    </main>
</body>
</html>
