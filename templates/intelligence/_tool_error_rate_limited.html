<div role="alert" class="ui-callout ui-callout-warning mt-3">
  <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  <div class="min-w-0">
    <p class="ui-callout-title">Slow down a sec</p>
    <p class="mt-0.5">You're calling Intelligence faster than your plan allows.
      {% if retry_after %}Retry in <span class="font-semibold tabular-nums">{{ retry_after }}s</span>.{% endif %}
    </p>
  </div>
</div>
