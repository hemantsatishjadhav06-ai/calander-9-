{% comment %}Polling overlay during sync-fallback. Lifts when /status/ returns active.{% endcomment %}
<div id="intelligence-finalizing-overlay"
     class="absolute inset-0 z-10 flex items-start justify-center rounded-2xl bg-white/85 px-4 pt-16 backdrop-blur-sm"
     hx-get="{% url 'intelligence:status' org_id=organization.id %}"
     hx-trigger="load, every 1s"
     hx-swap="outerHTML">
  <div class="ui-card w-full max-w-md text-center shadow-lg">
    <span class="ui-spinner mx-auto mb-4 block !size-8 !border-[3px]" aria-hidden="true"></span>
    <h2 class="text-h3 text-ink-950">Setting up your Intelligence access…</h2>
    <p class="mt-1.5 text-sm text-ink-700">
      Stripe confirmed your payment. We're finalizing access.
    </p>
  </div>
</div>
