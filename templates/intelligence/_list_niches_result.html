<div class="max-h-[400px] overflow-y-auto -m-1 rounded-lg p-1" role="region" aria-label="Niche catalog" tabindex="0">
    <ul class="space-y-1">
        {% for niche in result.niches %}
        <li class="flex items-center justify-between gap-3 rounded-lg px-2 py-2 hover:bg-ink-25">
            <div class="min-w-0">
                <div class="text-sm font-medium text-ink-900 truncate">{{ niche.name }}</div>
                <div class="font-mono text-caption text-ink-600 truncate">{{ niche.slug }}</div>
            </div>
            <span class="ui-pill flex-shrink-0 tabular-nums">{{ niche.gap_count }} gaps</span>
        </li>
        {% empty %}
        <li class="py-2 text-sm text-ink-600">No niches available.</li>
        {% endfor %}
    </ul>
</div>
