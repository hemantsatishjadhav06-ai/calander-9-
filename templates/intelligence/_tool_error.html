<div role="alert" class="ui-callout ui-callout-danger mt-3">
  <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16h.01"/></svg>
  <div class="min-w-0">
    <p class="ui-callout-title">Couldn't complete the request</p>
    <p class="mt-0.5 break-words">{{ message|default:"Please try again." }}</p>
    {% if code %}<p class="mt-1 font-mono text-caption">code: {{ code }}</p>{% endif %}
  </div>
</div>
