<div id="billing-contact-saved" class="mt-3 min-h-[20px]" role="status">
    {% if error %}
    <span class="ui-pill ui-pill-danger !h-auto min-h-[22px] whitespace-normal py-0.5">
        <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Couldn't save, billing service was unreachable. Please try again.
    </span>
    {% else %}
    <span class="ui-pill ui-pill-success !h-auto min-h-[22px] whitespace-normal break-all py-0.5">
        <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Saved · {{ billing_email }}
    </span>
    {% endif %}
</div>
