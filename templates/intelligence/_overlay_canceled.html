<div class="absolute inset-0 z-10 flex items-start justify-center rounded-2xl bg-white/85 px-4 pt-16 backdrop-blur-sm">
  <div class="ui-card w-full max-w-md text-center shadow-lg" role="status">
    <h2 class="text-h3 text-ink-950">Subscription canceled</h2>
    <p class="mt-1.5 text-sm text-ink-700">
      Resubscribe to start using Intelligence again.
    </p>
    {% if can_manage_billing %}
      <a href="{% url 'intelligence:subscribe' org_id=organization.id %}" class="ui-btn ui-btn-primary mt-5 no-underline">
        Resubscribe
      </a>
    {% else %}
      <p class="mt-4 text-small text-ink-600">Ask an org admin to resubscribe.</p>
    {% endif %}
  </div>
</div>
