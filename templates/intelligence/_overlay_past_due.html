<div class="absolute inset-0 z-10 flex items-start justify-center rounded-2xl bg-white/85 px-4 pt-16 backdrop-blur-sm">
  <div class="ui-card w-full max-w-md text-center shadow-lg" role="status">
    <span class="mx-auto mb-3 grid size-10 place-items-center rounded-full bg-warning-50 text-warning-600 ring-1 ring-inset ring-warning-200" aria-hidden="true">
      <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    </span>
    <h2 class="text-h3 text-ink-950">Your subscription is past due</h2>
    <p class="mt-1.5 text-sm text-ink-700">
      Update your payment method to continue using Intelligence.
    </p>
    {% if can_manage_billing %}
      <form method="post" action="{% url 'intelligence:portal' org_id=organization.id %}" class="mt-5">
        {% csrf_token %}
        <button type="submit" class="ui-btn ui-btn-primary">
          Update payment
        </button>
      </form>
    {% else %}
      <p class="mt-4 text-small text-ink-600">Ask an org admin to update payment.</p>
    {% endif %}
  </div>
</div>
