<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation expired - {{ SITE_NAME }}</title>
    <style>
        /* Standalone page (no app stylesheet): literal values from the design tokens. */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
            background: #F6F7F8;
            color: #1C1F24;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #E1E4E8;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px -8px rgba(14, 17, 20, .16), 0 4px 8px -2px rgba(14, 17, 20, .06);
        }
        @media (max-width: 480px) { .card { padding: 28px 20px; } }
        .logo { font-size: 16px; font-weight: 600; color: #0E1114; margin-bottom: 24px; }
        .icon { margin-bottom: 12px; color: #83888F; }
        h1 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 6px; color: #0E1114; }
        .message { font-size: 15px; color: #52575F; line-height: 1.6; margin-bottom: 24px; }
        .link {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            font-size: 14px;
            color: #115641;
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 600;
        }
        .link:hover { color: #0D4534; }
        .link:focus-visible { outline: 2px solid #1E7057; outline-offset: 2px; border-radius: 4px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">{{ SITE_NAME }}</div>
        <div class="icon" aria-hidden="true">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <h1>Invitation expired</h1>
        <p class="message">
            This invitation link is no longer valid. It may have expired or already been used. Ask your organization's admin for a new invitation.
        </p>
        <a href="/" class="link">Go to {{ SITE_NAME }}</a>
    </main>
</body>
</html>
