<!-- Workspace assignment form (loaded via HTMX into the modal body) -->
<form hx-post="{% url 'members:manage_workspaces' membership_id=membership.id %}" hx-disabled-elt="find button[type=submit]"
      hx-target="#member-{{ membership.id }}"
      hx-swap="outerHTML">
    {% csrf_token %}

    {% if workspace_data %}
    <div class="ui-list max-h-64 overflow-y-auto rounded-xl ring-1 ring-inset ring-ink-200">
        {% for wd in workspace_data %}
        <div class="flex items-center gap-3 px-3 py-2">
            <input type="checkbox" name="ws_{{ wd.workspace.id }}" value="1"
                   id="assign-ws-{{ wd.workspace.id }}"
                   {% if wd.assigned %}checked{% endif %}
                   class="ui-checkbox shrink-0 cursor-pointer">
            <label for="assign-ws-{{ wd.workspace.id }}" class="min-w-0 flex-1 cursor-pointer truncate py-1 text-sm text-ink-900">
                {{ wd.workspace.name }}
            </label>
            <select name="ws_role_{{ wd.workspace.id }}" aria-label="Role in {{ wd.workspace.name }}"
                    class="ui-input w-auto shrink-0 lg:h-8 lg:text-[13px]">
                {% for value, label in workspace_role_choices %}
                <option value="{{ value }}" {% if value == wd.current_role %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-sm text-ink-600">No workspaces available.</p>
    {% endif %}

    <div class="mt-5 flex justify-end">
        <button type="submit" class="ui-btn ui-btn-primary">Save workspaces</button>
    </div>
</form>
