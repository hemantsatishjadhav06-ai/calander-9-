<!-- Invite team member modal -->
<template x-teleport="body">
    <div x-show="showInviteModal" x-transition.opacity
         class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4"
         style="background: var(--overlay);">
        <div @click.outside="showInviteModal = false"
             @keydown.escape.window="showInviteModal = false"
             x-show="showInviteModal"
             x-trap.noscroll="showInviteModal"
             role="dialog" aria-modal="true" aria-labelledby="invite-member-modal-title"
             x-transition
             class="ui-modal flex max-h-[92vh] flex-col max-sm:rounded-b-none">

            <div class="ui-modal-header shrink-0">
                <h2 id="invite-member-modal-title" class="ui-modal-title">Invite team member</h2>
                <button type="button" @click="showInviteModal = false" class="ui-btn ui-btn-icon -mr-2 -mt-1" aria-label="Close">
                    <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <form hx-post="{% url 'members:invite' %}" hx-disabled-elt="find button[type=submit]"
                  hx-target="#invitations-list"
                  hx-swap="beforeend"
                  data-inline-error="#invite-error"
                  @htmx:after-request.window="if(event.detail.successful) { showInviteModal = false; document.getElementById('no-invites-placeholder')?.remove(); document.getElementById('invite-error').textContent = ''; }"
                  class="flex min-h-0 flex-col">
                {% csrf_token %}
                <div class="ui-modal-body min-h-0 space-y-5 overflow-y-auto">
                    <!-- Email -->
                    <div>
                        <label for="invite-email" class="ui-label">Email address</label>
                        <input type="email" id="invite-email" name="email" required placeholder="colleague@example.com" class="ui-input">
                    </div>

                    <!-- Organization role -->
                    <fieldset>
                        <legend class="ui-label">Organization role</legend>
                        <div class="flex flex-wrap gap-x-5 gap-y-2">
                            {% for value, label in org_role_choices %}
                            <label for="invite-role-{{ value }}" class="flex min-h-6 cursor-pointer select-none items-center gap-2 text-sm font-medium text-ink-900 max-lg:min-h-11">
                                <input type="radio" name="org_role" value="{{ value }}" {% if value == "member" %}checked{% endif %}
                                       id="invite-role-{{ value }}"
                                       class="size-4 cursor-pointer accent-brand-700">
                                {{ label }}
                            </label>
                            {% endfor %}
                        </div>
                    </fieldset>

                    <!-- Workspaces -->
                    <fieldset>
                        <legend class="ui-label">Workspaces</legend>
                        <p class="-mt-1 mb-2.5 text-small text-ink-600">Pick the workspaces they can open and their role in each.</p>

                        <div class="ui-list max-h-48 overflow-y-auto rounded-xl ring-1 ring-inset ring-ink-200">
                            {% for ws in org_workspaces %}
                            <div class="flex items-center gap-3 px-3 py-2">
                                <input type="checkbox" name="ws_{{ ws.id }}" value="1" id="invite-ws-{{ ws.id }}"
                                       class="ui-checkbox shrink-0 cursor-pointer">
                                <label for="invite-ws-{{ ws.id }}" class="min-w-0 flex-1 cursor-pointer truncate py-1 text-sm text-ink-900">
                                    {{ ws.name }}
                                </label>
                                <select name="ws_role_{{ ws.id }}" aria-label="Role in {{ ws.name }}"
                                        class="ui-input w-auto shrink-0 lg:h-8 lg:text-[13px]">
                                    {% for value, label in workspace_role_choices %}
                                    <option value="{{ value }}" {% if value == "editor" %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% endfor %}
                        </div>

                        <p class="ui-help">
                            Clients who only approve posts don't need a seat: invite them from the workspace's Client Portal settings.
                        </p>
                    </fieldset>

                    <!-- Error container (populated by the global htmx:responseError handler in base.html) -->
                    <div id="invite-error" role="alert" class="text-sm text-danger-500 empty:hidden"></div>
                </div>

                <div class="ui-modal-footer shrink-0">
                    <button type="button" @click="showInviteModal = false" class="ui-btn ui-btn-secondary">Cancel</button>
                    <button type="submit" class="ui-btn ui-btn-primary">Send invitation</button>
                </div>
            </form>
        </div>
    </div>
</template>
