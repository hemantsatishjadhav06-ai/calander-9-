<!-- Template picker modal content (loaded via HTMX) -->
<div class="p-1 space-y-0.5">
    {% for tpl in templates %}
    <a href="{% url 'composer:use_template' workspace_id=workspace.id template_id=tpl.id %}"
       class="block px-3 py-2.5 rounded-lg hover:bg-ink-50 transition-colors">
        <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-semibold text-ink-900">{{ tpl.name }}</span>
        </div>
        {% if tpl.description %}
        <p class="text-xs text-ink-600 line-clamp-1">{{ tpl.description }}</p>
        {% endif %}
        {% if tpl.template_data.caption %}
        <p class="text-xs text-ink-500 mt-1 line-clamp-1 font-mono">{{ tpl.template_data.caption|truncatechars:80 }}</p>
        {% endif %}
    </a>
    {% empty %}
    <div class="text-center px-4 py-8">
        <p class="text-sm font-semibold text-ink-900">No templates yet.</p>
        <p class="text-xs text-ink-500 mt-1">Save a post as a template to see it here.</p>
    </div>
    {% endfor %}
</div>
