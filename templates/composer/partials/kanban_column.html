<div class="kanban-column" data-group-id="{{ col.id }}"
     draggable="true"
     @dragstart="startColumnDrag($event, '{{ col.id }}')"
     @dragend="endColumnDrag($event)"
     @dragover.prevent="columnDragOver($event)"
     @dragleave="columnDragLeave($event)"
     @drop="dropColumn($event, '{{ col.id }}')">
    <div class="flex items-center justify-between px-3 py-2.5 column-header" style="cursor: grab;"
         @mousedown="columnHeaderMouseDown()">
        <div class="flex items-center gap-2">
            <span class="group-label text-[13px] font-semibold text-ink-900">{{ col.label }}</span>
            <span class="column-count ui-badge">{{ col.ideas|length }}</span>
        </div>
        <div class="flex items-center gap-0.5">
            <button aria-label="Add idea to {{ col.label }}" @click="showCreateModal = true; createGroupId = '{{ col.id }}'; createSelectedGroup = '{{ col.id }}'"
                    class="ui-btn ui-btn-icon !w-7 !h-7 max-lg:!w-11 max-lg:!h-11"
                    title="Add idea">
                <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <div class="relative" x-data="{ menuOpen: false }">
                <button aria-label="Column options for {{ col.label }}" aria-haspopup="true" :aria-expanded="menuOpen" @click="menuOpen = !menuOpen"
                        class="ui-btn ui-btn-icon !w-7 !h-7 max-lg:!w-11 max-lg:!h-11">
                    <svg aria-hidden="true" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
                </button>
                <div x-show="menuOpen" @click.away="menuOpen = false" x-cloak
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     class="ui-menu absolute right-0 top-full mt-1 z-50 min-w-[180px]">
                    {% if col.ideas|length == 0 %}
                    <button @click="menuOpen = false; deleteGroup('{{ col.id }}')"
                            class="ui-menu-item is-danger">
                        Delete column
                    </button>
                    {% else %}
                    <span class="block px-2.5 py-2 text-xs text-ink-500">
                        Remove all ideas first
                    </span>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <div class="kanban-cards"
         @dragover.prevent="dragOver($event)"
         @dragleave="dragLeave($event)"
         @drop="dropOnColumn($event, '{{ col.id }}')">
        {% for idea in col.ideas %}
            {% include "composer/partials/idea_card.html" with idea=idea group_id=col.id %}
        {% endfor %}
    </div>

    <button type="button" @click="showCreateModal = true; createGroupId = '{{ col.id }}'; createSelectedGroup = '{{ col.id }}'"
            class="new-idea-inline mx-1 mb-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New idea
    </button>
</div>
