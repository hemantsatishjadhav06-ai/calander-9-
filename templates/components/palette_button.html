{% comment %}
Go to (spec R2): opens the command palette (base.html), in the sidebar's header and in the phone's top
bar. Ctrl/Cmd-K opens it too, at every width. palette_class: extra classes (where it shows).
{% endcomment %}<button type="button" data-testid="palette-open" data-palette-open @click="$dispatch('open-palette')"
        class="{% if palette_class %}{{ palette_class }} {% endif %}ui-btn ui-btn-icon flex-shrink-0"
        aria-label="Go to a page" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" title="Go to a page (Ctrl+K)">
    <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
</button>
