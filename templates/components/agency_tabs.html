{% comment %}The agency's tabs. Context: tabs (from apps.studio.dashboard.tabs).{% endcomment %}
{% if tabs %}
<nav aria-label="Agency" class="flex gap-6 overflow-x-auto border-b border-stone-200 mb-6 -mt-1">
    {% for tab in tabs %}
    <a href="{{ tab.url }}" class="whitespace-nowrap pb-2.5 text-sm border-b-2 focus-visible:outline-2 focus-visible:outline-orange-700 rounded-t {% if tab.active %}border-orange-700 font-semibold text-orange-800{% else %}border-transparent text-stone-600 hover:text-stone-900{% endif %}"{% if tab.active %} aria-current="page"{% endif %}>{{ tab.label }}</a>
    {% endfor %}
</nav>
{% endif %}
