{% comment %}The agency's peer views (Home / Routines / Team / Settings) as a segmented control: ink, never the accent. Context: tabs (from apps.studio.dashboard.tabs).{% endcomment %}
{% if tabs %}
<nav aria-label="Agency" class="mb-6 max-w-full">
    <div class="ui-segmented">
        {% for tab in tabs %}
        <a href="{{ tab.url }}" class="ui-segment"{% if tab.active %} aria-current="page"{% endif %}>{{ tab.label }}</a>
        {% endfor %}
    </div>
</nav>
{% endif %}
