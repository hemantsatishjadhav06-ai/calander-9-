{% load analytics_extras %}
<div id="analytics-hero-chart">
    <div class="mb-4 flex flex-wrap items-end justify-between gap-4">
        <div class="flex-shrink-0">
            <h2 class="text-small font-medium text-ink-600">{{ chart.label }} · last {{ days }} days</h2>
            <div class="mt-2 flex items-center gap-3">
                <span class="text-[32px] font-bold leading-none tracking-[-0.025em] tabular-nums text-ink-950">{{ chart.derived.value|fmt_metric:chart.derived.kind }}</span>
                <span class="a-delta {{ chart.derived.delta|delta_color }}">{{ chart.derived.delta|fmt_signed }}</span>
            </div>
        </div>
        <div class="flex flex-wrap gap-1" role="group" aria-label="Metric to chart">
            {% for chip in chart.chips %}
                <a href="?range={{ days }}&chart_metric={{ chip.key }}"
                   hx-get="?range={{ days }}&chart_metric={{ chip.key }}&partial=chart"
                   hx-target="#analytics-hero-chart"
                   hx-swap="outerHTML"
                   class="ui-filter-chip no-underline {% if chip.key == chart.metric %}is-selected{% endif %}"
                   {% if chip.key == chart.metric %}aria-current="true"{% endif %}>{{ chip.label }}</a>
            {% endfor %}
        </div>
    </div>

    <div class="relative h-[260px] w-full overflow-hidden max-sm:h-[200px]">
        <canvas id="analytics-area-chart"
                role="img"
                aria-label="{{ chart.label }} over the last {{ days }} days"
                data-series="{{ chart_series_json }}"
                data-labels="{{ chart_labels_json }}"
                style="position: absolute; inset: 0;"></canvas>
    </div>
</div>
