{% load analytics_extras %}
<div class="a-card flex h-full flex-col justify-between gap-3 p-4">
    <div>
        <div class="text-small font-medium text-ink-600">{{ label }}</div>
        <div class="mt-2 flex items-end justify-between gap-2">
            <span class="text-[26px] font-bold leading-none tracking-[-0.02em] tabular-nums text-ink-950">{{ derived.value|fmt_metric:derived.kind }}</span>
            <span class="a-delta {{ derived.delta|delta_color }}">{{ derived.delta|fmt_signed }}</span>
        </div>
    </div>
    <div class="text-ink-700 [&_svg]:w-full" aria-hidden="true">{% sparkline derived.series "var(--ink-700)" 150 32 %}</div>
</div>
