<!-- HTMX partial returned after creating a connection link -->
<div class="mb-4 rounded-xl bg-success-50 px-4 py-3.5 ring-1 ring-inset ring-success-200">
    <div class="mb-3 flex items-center gap-2">
        <svg class="h-4 w-4 flex-shrink-0 text-success-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="text-sm font-semibold text-success-700">Connection link created</span>
    </div>

    <!-- Copyable link -->
    <div x-data="{ copied: false, copyFailed: false }">
        <div class="flex items-center gap-2">
            <input
                type="text"
                value="{{ link_url }}"
                readonly
                id="connection-link-url"
                x-ref="connectionLink"
                aria-label="Connection link"
                class="ui-input min-w-0 flex-1 font-mono text-[13px]"
            >
            <button
                type="button"
                @click="copyFailed = false; if (navigator.clipboard) { navigator.clipboard.writeText($refs.connectionLink.value).then(() => { copied = true; setTimeout(() => copied = false, 2000); }).catch(() => { $refs.connectionLink.select(); copyFailed = true; }); } else { $refs.connectionLink.select(); copyFailed = true; }"
                class="ui-btn ui-btn-secondary flex-shrink-0"
            >
                <span x-show="!copied">Copy</span>
                <span x-show="copied" x-cloak>Copied</span>
            </button>
        </div>
        <p x-show="copyFailed" x-cloak role="status" class="mt-2 text-xs text-ink-700">Select and copy the link manually.</p>
    </div>

    <p class="mt-2 text-xs text-ink-700">
        Expires {{ link.expires_at|date:"j M Y" }}. Share this link with your client so they can connect their social accounts.
    </p>
</div>
