<div x-data="{ showForm: false }" @keydown.escape.window="showForm = false" class="flex-shrink-0">
    <button type="button" :aria-expanded="showForm" aria-controls="connection-devto-form" @click="showForm = !showForm" class="ui-btn ui-btn-sm ui-btn-tinted">
        Connect<span class="sr-only"> DEV.to</span>
    </button>
    <div x-show="showForm" x-cloak @click.self="showForm = false" class="ui-overlay z-50 flex items-center justify-center p-4">
        <form id="connection-devto-form" role="dialog" aria-modal="true" aria-labelledby="connection-devto-title" x-trap.noscroll="showForm"
              method="post" action="{% url 'onboarding:connection_devto' token=link.token %}" class="ui-modal max-w-[400px]">
            {% csrf_token %}
            <div class="ui-modal-header"><h2 id="connection-devto-title" class="ui-modal-title">Connect DEV.to</h2></div>
            <div class="ui-modal-body">
                <label for="connection-devto-api-key" class="ui-label">API key</label>
                <input type="password" id="connection-devto-api-key" name="api_key" required autocomplete="off" aria-describedby="connection-devto-api-key-help" class="ui-input">
                <p id="connection-devto-api-key-help" class="ui-help">Create a key at DEV.to &rarr; Settings &rarr; Extensions &rarr; DEV Community API Keys.</p>
            </div>
            <div class="ui-modal-footer">
                <button type="button" @click="showForm = false" class="ui-btn ui-btn-secondary">Cancel</button>
                <button type="submit" class="ui-btn ui-btn-primary">Connect</button>
            </div>
        </form>
    </div>
</div>
