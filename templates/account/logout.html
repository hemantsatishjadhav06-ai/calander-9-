{% extends "base.html" %}
{% load static i18n %}

{% block title %}Sign out · {{ SITE_NAME }}{% endblock %}

{% block auth_content %}
<div class="w-full max-w-[400px]">
    {% include "account/_brand.html" %}

    <div class="auth-card">
        <h1 class="text-h1 text-ink-950">Sign out?</h1>
        <p class="mt-1.5 text-sm text-ink-600">You can sign back in at any time.</p>
        <form method="post" action="{% url 'account_logout' %}" class="mt-6">
            {% csrf_token %}
            <div class="flex flex-col-reverse gap-3 sm:flex-row">
                <a href="/" class="ui-btn ui-btn-secondary ui-btn-lg flex-1">Cancel</a>
                <button type="submit" class="ui-btn ui-btn-primary ui-btn-lg flex-1">Sign out</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
