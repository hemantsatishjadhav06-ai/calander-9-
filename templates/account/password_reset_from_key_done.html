{% extends "base.html" %}
{% load static i18n %}

{% block title %}Password changed · {{ SITE_NAME }}{% endblock %}

{% block auth_content %}
<div class="w-full max-w-[400px]">
    {% include "account/_brand.html" %}

    <div class="auth-card">
        <div class="mb-5 grid size-10 place-items-center rounded-xl bg-success-50 text-success-600 ring-1 ring-inset ring-success-200" aria-hidden="true">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1 class="text-h1 text-ink-950">Password changed</h1>
        <p class="mt-1.5 text-sm text-ink-600">Your password has been updated. Sign in with the new one.</p>
        <a href="{% url 'account_login' %}" class="ui-btn ui-btn-primary ui-btn-lg mt-6 w-full">Sign in</a>
    </div>
</div>
{% endblock %}
