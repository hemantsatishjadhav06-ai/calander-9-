{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept the terms · {{ SITE_NAME }}</title>
    <link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'favicon/favicon-96x96.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body>
<main class="auth-bg flex min-h-screen items-center justify-center px-4 py-12">
    <div class="w-full max-w-[400px]">
        {% include "account/_brand.html" %}

        <div class="auth-card">
            <h1 class="text-h1 text-ink-950">Almost there</h1>
            <p class="mt-1.5 text-sm text-ink-600">One quick step before you get started: review and accept the terms.</p>

            <div class="mt-6">
                {% include "account/_messages.html" %}

                <form method="post">
                    {% csrf_token %}

                    <label for="id_agree" class="mb-6 flex cursor-pointer items-start gap-3 rounded-xl p-3.5 ring-1 ring-inset ring-ink-200 transition-colors hover:bg-ink-25 has-[:checked]:bg-brand-50 has-[:checked]:ring-brand-700">
                        <input type="checkbox"
                               name="agree"
                               id="id_agree"
                               class="ui-checkbox mt-0.5 flex-shrink-0 cursor-pointer">
                        <span class="text-sm text-ink-900">
                            I agree to the
                            <a href="{{ LEGAL_TERMS_URL }}" target="_blank" rel="noopener" class="link-inline font-medium">Terms of Service</a>
                            and
                            <a href="{{ LEGAL_PRIVACY_URL }}" target="_blank" rel="noopener" class="link-inline font-medium">Privacy Policy</a>
                        </span>
                    </label>

                    <button type="submit" class="ui-btn ui-btn-primary ui-btn-lg w-full">Continue</button>
                </form>
            </div>
        </div>

        <form method="post" action="{% url 'accounts:logout' %}" class="mt-6 text-center">
            {% csrf_token %}
            <button type="submit" class="inline-flex min-h-6 cursor-pointer items-center rounded-md text-sm font-medium text-ink-600 underline underline-offset-3 hover:text-ink-900 max-lg:min-h-11">Sign out</button>
        </form>
    </div>
</main>
</body>
</html>
