{% extends "base.html" %}
{% load humanize %}

{% block title %}{{ message.sender_name }} - Inbox - {{ workspace.name }} - {{ SITE_NAME }}{% endblock %}

{% block extra_head %}
<style>
    /* One message on its own page: the back link, then the message in a card that fills the height. */
    .inbox-detail-full { display: flex; flex-direction: column; flex: 1; min-height: 0; margin-bottom: -1.5rem; }
    :has(> .inbox-detail-full) { overflow: visible !important; }
    @media (min-width: 1024px) { .inbox-detail-full { margin-bottom: -2rem; } }

    /* Small status pills (same as the inbox list) */
    .badge-pill {
        display: inline-flex; align-items: center; gap: 4px; height: 20px;
        font-size: 12px; line-height: 16px; font-weight: 600; padding: 0 7px;
        border-radius: 9999px; white-space: nowrap;
        background: var(--ink-100); color: var(--ink-700); box-shadow: inset 0 0 0 1px var(--ink-200);
    }
    .badge-pill svg { width: 11px; height: 11px; flex: none; }
    .badge-sentiment-positive { background: var(--success-50); color: var(--success-600); box-shadow: inset 0 0 0 1px var(--success-200); }
    .badge-sentiment-positive svg { color: var(--success-500); }
    .badge-sentiment-neutral  { background: var(--ink-100); color: var(--ink-700); }
    .badge-sentiment-negative { background: var(--danger-50); color: var(--danger-600); box-shadow: inset 0 0 0 1px var(--danger-200); }
    .badge-sentiment-negative svg { color: var(--danger-500); }
    .badge-type { background: transparent; box-shadow: none; padding: 0; color: var(--ink-600); font-weight: 500; }
    .badge-status-unread, .badge-status-open { background: var(--warning-50); color: var(--warning-600); box-shadow: inset 0 0 0 1px var(--warning-200); }
    .badge-status-resolved { background: var(--success-50); color: var(--success-600); box-shadow: inset 0 0 0 1px var(--success-200); }
    .badge-status-archived { background: var(--ink-100); color: var(--ink-700); }
    .sla-countdown { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sla-ok { color: var(--ink-600); }
    .sla-warn { color: var(--warning-600); }
    .sla-overdue { color: var(--danger-600); }
</style>
{% endblock %}

{% block content %}
<div class="inbox-detail-full w-full max-w-[880px]" x-data="{
    slaTarget: {{ sla_config.target_response_minutes|default:'0' }},
    getSlaClass(receivedAt) {
        if (!this.slaTarget) return '';
        const deadline = new Date(new Date(receivedAt).getTime() + this.slaTarget * 60000);
        const remaining = deadline - new Date();
        if (remaining < 0) return 'sla-overdue';
        if (remaining < this.slaTarget * 60000 * 0.25) return 'sla-warn';
        return 'sla-ok';
    },
    formatSla(receivedAt) {
        if (!this.slaTarget) return '';
        const deadline = new Date(new Date(receivedAt).getTime() + this.slaTarget * 60000);
        const diff = deadline - new Date();
        const mins = Math.floor(Math.abs(diff) / 60000);
        if (diff < 0) return mins < 60 ? mins + 'm overdue' : Math.floor(mins/60) + 'h overdue';
        return mins < 60 ? mins + 'm left' : Math.floor(mins/60) + 'h ' + (mins%60) + 'm left';
    }
}">
    <!-- Back link -->
    <div class="mb-3 flex-shrink-0">
        <a href="{% url 'inbox:feed' workspace_id=workspace.id %}" class="ui-btn ui-btn-ghost -ml-3 no-underline">
            <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back to inbox
        </a>
    </div>
    <div id="inbox-detail-panel" class="min-h-0 flex-1 overflow-hidden rounded-2xl border border-ink-200 bg-white shadow-xs">
        {% include "inbox/partials/_message_panel.html" %}
    </div>
</div>
{% endblock %}
