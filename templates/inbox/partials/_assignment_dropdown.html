<!-- Assignment menu -->
<div x-data="{ assignOpen: false }" class="relative">
    <button type="button" aria-haspopup="true" :aria-expanded="assignOpen" @click="assignOpen = !assignOpen"
            class="ui-btn ui-btn-ghost ui-btn-sm !px-2"
            {% if message.assigned_to %}aria-label="Assigned to {{ message.assigned_to.get_short_name|default:message.assigned_to.email }}. Change"{% endif %}>
        {% if message.assigned_to %}
        <span class="grid size-5 flex-shrink-0 place-items-center rounded-full bg-ink-900 text-[11px] font-semibold text-white" aria-hidden="true">
            {{ message.assigned_to.email|make_list|first|upper }}
        </span>
        <span class="max-w-[9rem] truncate text-ink-900">{{ message.assigned_to.get_short_name|default:message.assigned_to.email|truncatechars:14 }}</span>
        {% else %}
        <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Assign
        {% endif %}
    </button>
    <div x-show="assignOpen" @click.away="assignOpen = false" @keydown.escape.window="assignOpen = false" x-cloak x-transition
         class="ui-menu absolute right-0 top-full z-50 mt-1 max-h-[240px] min-w-[200px] overflow-y-auto">
        {% if message.assigned_to %}
        <button type="button"
                hx-post="{% url 'inbox:assign' workspace_id=workspace.id message_id=message.id %}"
                hx-vals='{"assigned_to": ""}'
                hx-target="#inbox-detail-panel"
                hx-swap="innerHTML"
                @click="assignOpen = false"
                class="ui-menu-item">
            <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            Unassign
        </button>
        <div class="ui-menu-separator" role="separator"></div>
        {% endif %}
        {% for membership in team_members %}
        <button type="button"
                hx-post="{% url 'inbox:assign' workspace_id=workspace.id message_id=message.id %}"
                hx-vals='{"assigned_to": "{{ membership.user.id }}"}'
                hx-target="#inbox-detail-panel"
                hx-swap="innerHTML"
                @click="assignOpen = false"
                class="ui-menu-item {% if message.assigned_to and message.assigned_to.id == membership.user.id %}font-semibold{% endif %}">
            <span class="grid size-5 flex-shrink-0 place-items-center rounded-full bg-ink-100 text-[11px] font-semibold text-ink-700" aria-hidden="true">
                {{ membership.user.email|make_list|first|upper }}
            </span>
            <span class="flex-1 truncate">{{ membership.user.get_short_name|default:membership.user.email }}</span>
            {% if message.assigned_to and message.assigned_to.id == membership.user.id %}
            <svg aria-label="Assigned" class="!text-brand-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            {% endif %}
        </button>
        {% endfor %}
    </div>
</div>
