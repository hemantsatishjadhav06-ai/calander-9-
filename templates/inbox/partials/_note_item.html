{% load humanize %}
<div class="rounded-xl border border-dashed border-ink-400 bg-ink-25 px-3.5 py-2.5">
    <div class="mb-1 flex flex-wrap items-center gap-x-2 gap-y-0.5">
        <span class="inline-flex items-center gap-1.5 text-caption font-semibold text-ink-700">
            <svg class="size-3.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            Note for the team
        </span>
        <span class="text-caption text-ink-600">{{ note.author.get_short_name|default:note.author.email }}</span>
        <span class="ml-auto text-caption text-ink-500">{{ note.created_at|timesince }} ago</span>
    </div>
    <p class="whitespace-pre-wrap text-sm text-ink-900">{{ note.body }}</p>
</div>
