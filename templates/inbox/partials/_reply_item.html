{% load humanize %}
<div class="flex justify-end" data-testid="inbox-thread-reply-{{ reply.id }}">
    <div class="max-w-[85%] min-w-0">
        <p class="mb-1 text-right text-caption text-ink-500">
            <span class="font-medium text-ink-700">{{ reply.author.get_short_name|default:reply.author.email }}</span>
            · Sent {{ reply.sent_at|timesince }} ago
        </p>
        <div class="rounded-[18px] rounded-br-md bg-ink-100 px-3.5 py-2.5">
            <p class="whitespace-pre-wrap text-body-lg text-ink-900">{{ reply.body }}</p>
        </div>
    </div>
</div>
