{% comment %}Empty state when no assets match. Expects: query (optional){% endcomment %}

<div class="ui-empty py-16">
  <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
  </svg>

  {% if query %}
    <h3 class="ui-empty-title">No media matches your search</h3>
    <p class="ui-empty-body">Try other words or another file type.</p>
    <a href="{% url 'media_library:index' workspace_id=workspace.id %}"
       class="ui-btn ui-btn-secondary mt-4">
      Clear search
    </a>
  {% else %}
    <h3 class="ui-empty-title">No media uploaded yet</h3>
    <p class="ui-empty-body">Upload pictures and videos once, then use them in any post.</p>
    <button type="button" @click="$refs.fileInput.click()"
            class="ui-btn ui-btn-secondary mt-4">
      <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      Upload media
    </button>
  {% endif %}
</div>
