{% comment %}Modal for creating a new folder. Expects: workspace{% endcomment %}

<div class="fixed inset-0 z-50 flex items-center justify-center p-4" @keydown.escape.window="showNewFolder = false">
  <!-- Backdrop -->
  <div class="ui-overlay" @click="showNewFolder = false"></div>

  <!-- Modal -->
  <div class="ui-modal !max-w-sm"
       x-trap.noscroll="showNewFolder" role="dialog" aria-modal="true" aria-labelledby="new-folder-title"
       @click.stop>
    <form hx-post="{% url 'media_library:folder_create' workspace_id=workspace.id %}" hx-disabled-elt="find button[type=submit]"
          hx-target="#folder-tree"
          hx-swap="innerHTML"
          @htmx:after-request="showNewFolder = false">
      <div class="ui-modal-header">
        <h3 id="new-folder-title" class="ui-modal-title">New folder</h3>
      </div>
      <div class="ui-modal-body">
        <input type="text" name="name" placeholder="Folder name" aria-labelledby="new-folder-title"
               class="ui-input"
               required autofocus>
      </div>

      <div class="ui-modal-footer">
        <button type="button" @click="showNewFolder = false"
                class="ui-btn ui-btn-secondary">
          Cancel
        </button>
        <button type="submit"
                class="ui-btn ui-btn-primary">
          Create folder
        </button>
      </div>
    </form>
  </div>
</div>
