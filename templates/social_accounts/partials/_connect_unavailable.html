{% comment %}
In place of a connect form when the workspace's extra_providers switch withholds the platform
(apps/social_accounts/availability.py). Says so in words; the page itself still answers.
{% endcomment %}<div class="ui-callout" role="status" data-testid="connect-unavailable">
    <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <p>{{ unavailable }} <a href="{% url 'social_accounts:connect' workspace_id=workspace_id %}" class="link-inline">Choose another platform</a>.</p>
</div>
