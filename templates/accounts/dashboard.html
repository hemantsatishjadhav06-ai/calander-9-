{% extends "base.html" %}

{% block title %}Dashboard · {{ SITE_NAME }}{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-200px)] items-center justify-center">
    <div class="w-full max-w-[440px] text-center">
        <div class="mx-auto mb-5 grid size-14 place-items-center rounded-2xl bg-white text-ink-700 shadow-xs ring-1 ring-inset ring-ink-200" aria-hidden="true">
            <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
        </div>

        <h1 class="text-h1 text-ink-950">No workspaces yet</h1>
        <p class="mx-auto mt-2 max-w-[44ch] text-body-lg text-ink-600">
            A workspace is one brand: its posts, accounts and team. Create one to get started.
        </p>

        <form method="post" action="{% url 'workspaces:create' %}" class="ui-card mt-8 text-left">
            {% csrf_token %}
            <label for="dashboard-workspace-name" class="ui-label">Workspace name</label>
            <input
                type="text"
                id="dashboard-workspace-name"
                name="name"
                placeholder="e.g. My Brand, Client Name"
                required
                class="ui-input"
            >
            <button type="submit" class="ui-btn ui-btn-primary ui-btn-lg mt-4 w-full">
                Create workspace
            </button>
        </form>
    </div>
</div>
{% endblock %}
