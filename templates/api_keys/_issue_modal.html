{% comment %}
Issuance modal — Alpine for open/close, HTMX for the cascading workspace
→ accounts + permissions partial. The actual POST is a normal Django
form submit (no HTMX) so the response can render the one-time token
reveal modal on top of the freshly-rendered list page.
{% endcomment %}
<template x-teleport="body">
    <div x-show="showIssueModal" x-transition.opacity
         @keydown.escape.window="showIssueModal = false"
         class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4"
         style="background: var(--overlay);">
        <div @click.outside="showIssueModal = false"
             x-show="showIssueModal" x-transition
             x-trap.noscroll="showIssueModal" role="dialog" aria-modal="true" aria-labelledby="issue-key-title"
             class="ui-modal flex max-h-[92vh] flex-col max-sm:rounded-b-none">
            <form method="POST" action="{% url 'api_keys:issue' %}" class="flex min-h-0 flex-col">
                {% csrf_token %}
                <div class="ui-modal-header shrink-0">
                    <div>
                        <h2 id="issue-key-title" class="ui-modal-title">Issue a new API key</h2>
                        <p class="mt-0.5 text-small text-ink-600">
                            You'll see the key <span class="font-semibold text-ink-900">once</span>, right after it's made.
                        </p>
                    </div>
                    <button type="button" @click="showIssueModal = false" aria-label="Close" class="ui-btn ui-btn-icon -mr-2 -mt-1">
                        <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>

                <div class="ui-modal-body min-h-0 flex-1 space-y-5 overflow-y-auto">
                    <div>
                        <label for="name" class="ui-label">Name</label>
                        <input type="text" id="name" name="name" required maxlength="100" autocomplete="off"
                               placeholder="e.g. Zapier bot, content pipeline"
                               class="ui-input">
                    </div>

                    <div>
                        <label for="workspace_id" class="ui-label">Workspace</label>
                        <select id="workspace_id" name="workspace_id" required
                                hx-get="{% url 'api_keys:workspace_options' %}"
                                hx-trigger="change"
                                hx-target="#workspace-options-target"
                                hx-include="this"
                                class="ui-input">
                            <option value="">Pick a workspace…</option>
                            {% for ws in issuance.workspaces %}
                            <option value="{{ ws.id }}">{{ ws.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    {# Populated by HTMX once a workspace is picked. #}
                    <div id="workspace-options-target" class="space-y-5 empty:hidden"></div>

                    <div>
                        <label for="expires_at" class="ui-label">
                            Expires on <span class="font-normal text-ink-600">(optional)</span>
                        </label>
                        <input type="date" id="expires_at" name="expires_at" class="ui-input">
                    </div>
                </div>

                <div class="ui-modal-footer shrink-0">
                    <button type="button" @click="showIssueModal = false" class="ui-btn ui-btn-secondary">Cancel</button>
                    <button type="submit" class="ui-btn ui-btn-primary">Create key</button>
                </div>
            </form>
        </div>
    </div>
</template>
