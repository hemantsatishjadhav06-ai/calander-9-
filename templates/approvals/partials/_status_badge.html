{% comment %}Editorial-status pill: icon + word in one of the five status tones. `meta` = {tone, icon, label, …} from approval_extras.status_badge.{% endcomment %}
<span class="ui-pill{% if meta.tone != 'neutral' %} ui-pill-{{ meta.tone }}{% endif %}">{% include "approvals/partials/_status_icon.html" with icon=meta.icon %}{{ meta.label }}</span>
