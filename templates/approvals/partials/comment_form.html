<form hx-post="{% url 'approvals:add_comment' workspace_id=workspace.id post_id=post.id %}" hx-disabled-elt="find button[type=submit]"
      hx-target="#comment-list-{{ post.id }}"
      hx-swap="outerHTML"
      hx-encoding="multipart/form-data"
      class="space-y-2"
      x-data="{ visibility: 'external' }">

    <textarea name="body" rows="2" required aria-label="Comment"
              class="ui-input resize-none"
              :class="visibility === 'internal' && 'border-dashed bg-ink-25'"
              placeholder="Write a comment… Use @name to mention someone"></textarea>

    <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
            <!-- Who sees it: a note for the team is drawn dashed, never in warning colours -->
            <div class="ui-segmented" role="group" aria-label="Who can see this comment">
                <button type="button" @click="visibility = 'external'"
                        :class="visibility === 'external' && 'is-active'" :aria-pressed="(visibility === 'external').toString()"
                        class="ui-segment">
                    Visible to client
                </button>
                <button type="button" @click="visibility = 'internal'"
                        :class="visibility === 'internal' && 'is-active'" :aria-pressed="(visibility === 'internal').toString()"
                        class="ui-segment gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    Internal only
                </button>
            </div>
            <input type="hidden" name="visibility" :value="visibility">

            <!-- Attachment -->
            {# sr-only, not hidden: a display:none input cannot take keyboard focus, so
               attaching an image was mouse-only. The ring shows where focus is. #}
            <label class="ui-btn ui-btn-icon cursor-pointer focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-brand-600"
                   title="Attach an image">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                <input type="file" name="attachment" accept="image/*" class="sr-only" aria-label="Attach an image">
            </label>
        </div>

        <button type="submit" class="ui-btn ui-btn-secondary ui-btn-sm">
            Comment
        </button>
    </div>
</form>
