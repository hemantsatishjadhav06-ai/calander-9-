<!-- Custom Calendar Event create/edit form (loaded via HTMX into modal) -->
<div class="p-5">
    <h3 class="text-h3 text-ink-950 mb-4">
        {% if event %}Edit event{% else %}Add an event{% endif %}
    </h3>

    <form {% if event %}
          hx-post="{% url 'calendar:event_edit' workspace_id=workspace.id event_id=event.id %}"
          {% else %}
          hx-post="{% url 'calendar:event_create' workspace_id=workspace.id %}"
          {% endif %}
          hx-disabled-elt="find button[type=submit]"
          hx-swap="none"
          class="space-y-4">
        {% csrf_token %}

        <div>
            <label for="event-title" class="ui-label">Title</label>
            <input type="text" id="event-title" name="title"
                   value="{% if event %}{{ event.title }}{% endif %}"
                   placeholder="e.g. Product launch, campaign start"
                   required
                   class="ui-input">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="event-start-date" class="ui-label">Start date</label>
                <input type="date" id="event-start-date" name="start_date"
                       value="{% if event %}{{ event.start_date|date:'Y-m-d' }}{% endif %}"
                       required
                       class="form-datetime">
            </div>
            <div>
                <label for="event-end-date" class="ui-label">End date</label>
                <input type="date" id="event-end-date" name="end_date"
                       value="{% if event %}{{ event.end_date|date:'Y-m-d' }}{% endif %}"
                       required
                       class="form-datetime">
            </div>
        </div>

        <div>
            <label for="event-color" class="ui-label">Colour</label>
            <div class="flex items-center gap-2">
                <input type="color" id="event-color" name="color"
                       value="{% if event %}{{ event.color }}{% else %}#3B82F6{% endif %}"
                       class="w-9 h-9 rounded-lg border border-ink-400 cursor-pointer p-0.5">
                {# Preset swatches are the person's own label colours (content), not interface colours. #}
                <div class="flex gap-1.5"
                     x-data="{ presets: ['#3B82F6','#22C55E','#EAB308','#F97316','#EF4444','#8B5CF6','#EC4899','#14B8A6'] }">
                    <template x-for="hex in presets" :key="hex">
                        <button type="button"
                                :aria-label="'Use colour ' + hex"
                                @click="$el.closest('form').querySelector('[name=color]').value = hex"
                                class="w-6 h-6 rounded-full ring-1 ring-inset ring-ink-950/10"
                                :style="'background: ' + hex"></button>
                    </template>
                </div>
            </div>
        </div>

        <div>
            <label for="event-description" class="ui-label">Description <span class="font-normal text-ink-500">(optional)</span></label>
            <textarea id="event-description" name="description" rows="2" placeholder="Notes about this event…" class="ui-input">{% if event %}{{ event.description }}{% endif %}</textarea>
        </div>

        <div class="flex items-center justify-between gap-2 pt-1">
            {% if event %}
            <form x-data hx-post="{% url 'calendar:event_delete' workspace_id=workspace.id event_id=event.id %}" hx-swap="none" class="inline"
                  @submit="if(!confirm('Delete this event?')) $event.preventDefault()">
                {% csrf_token %}
                <button type="submit" class="ui-btn ui-btn-danger-ghost ui-btn-sm">Delete event</button>
            </form>
            {% else %}
            <div></div>
            {% endif %}
            <div class="flex items-center gap-2">
                <button type="button" @click="showEventForm = false" class="ui-btn ui-btn-ghost">Cancel</button>
                <button type="submit" class="ui-btn ui-btn-primary"
                        @htmx:after-request="showEventForm = false">
                    {% if event %}Save changes{% else %}Add event{% endif %}
                </button>
            </div>
        </div>
    </form>
</div>
