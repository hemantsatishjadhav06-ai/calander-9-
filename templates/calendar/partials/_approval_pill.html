{% comment %}Approvals filter chip (selected = ink, never the accent). Vars: pid, label, count. Uses status_filter + workspace from context.{% endcomment %}
<button type="button" hx-get="{% url 'calendar:publish_tab_approvals' workspace_id=workspace.id %}?approval_status={{ pid }}{% if approval_filter_qs %}&{{ approval_filter_qs }}{% endif %}"
        hx-target="#tab-content" hx-swap="innerHTML"
        aria-pressed="{% if status_filter == pid %}true{% else %}false{% endif %}"
        class="ui-filter-chip">
    {{ label }} <span class="tabular-nums {% if status_filter == pid %}text-ink-300{% else %}text-ink-500{% endif %}">{{ count }}</span>
</button>
