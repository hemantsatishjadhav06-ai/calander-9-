services:
  migrate:
    build: .
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the postgres service with the same POSTGRES_PASSWORD}
      MEDIA_STORAGE_PERSISTENT: "true"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    # Retain the Dockerfile's deployment checks and memory-safe Gunicorn defaults.
    ports: !reset []
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request, urllib.parse; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': urllib.parse.urlsplit(os.environ['APP_URL']).netloc}), timeout=10)"
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 30s
    volumes:
      - media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the postgres service with the same POSTGRES_PASSWORD}
      MEDIA_STORAGE_PERSISTENT: "true"
      MEDIA_ROOT: /app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    volumes:
      - media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the postgres service with the same POSTGRES_PASSWORD}
      MEDIA_STORAGE_PERSISTENT: "true"
      MEDIA_ROOT: /app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD and encode it in DATABASE_URL}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Read-only so Caddy can serve uploads but never write into MEDIA_ROOT.
      - media_data:/app/media:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public hostname for automatic HTTPS}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      CADDY_MEDIA_ROOT: /app/media
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
